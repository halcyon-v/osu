on: [push, workflow_dispatch]
name: Build iOS IPA

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install .NET Workloads
        run: dotnet workload install ios

      - name: Use Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Publish IPA
        run: dotnet publish osu.iOS/osu.iOS.csproj -c Release -p:ArchiveOnBuild=true -p:BuildIpa=true -p:CodesignKey=-

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: osu-ios-unsigned
          path: "osu.iOS/bin/Release/net8.0-ios/**/*.ipa"
